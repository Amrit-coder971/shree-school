<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Add Student</title>
<head>
<meta charset="ISO-8859-1">
<title>Add Student</title>
<style>
	body {
	    font-family: Arial, sans-serif;
	    background-color: #f8f9fa;
	    margin: 0;
	    padding: 0;
	}

	.navbar {
	    background-color: #343a40;
	    padding: 15px 20px;
	}

	.navbar .navbar-brand {
	    color: #fff;
	    font-size: 24px;
	    text-decoration: none;
	}

	.container {
	    max-width: 600px;
	    margin: 40px auto;
	}

	.card {
	    background-color: #fff;
	    border-radius: 8px;
	    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
	    overflow: hidden;
	}

	.card-header {
	    background-color: #007bff;
	    color: #fff;
	    padding: 15px 20px;
	}

	.card-header h4 {
	    margin: 0;
	}

	.card-body {
	    padding: 20px;
	}

	.form-group {
	    margin-bottom: 15px;
	}

	.form-group label {
	    display: block;
	    margin-bottom: 5px;
	    font-weight: bold;
	}

	.form-control {
	    width: 100%;
	    padding: 10px 12px;
	    font-size: 14px;
	    border: 1px solid #ced4da;
	    border-radius: 4px;
	    box-sizing: border-box;
	}

	.form-control:focus {
	    border-color: #007bff;
	    outline: none;
	    box-shadow: 0 0 3px rgba(0,123,255,0.5);
	}

	.text-center {
	    text-align: center;
	    margin-top: 20px;
	}

	.text-center a {
	    display: inline-block;
	    padding: 10px 25px;
	    margin: 0 10px;
	    border-radius: 5px;
	    text-decoration: none;
	    color: #fff;
	    font-weight: bold;
	    transition: background-color 0.3s ease;
	}

	.text-center a.success {
	    background-color: #28a745;
	}

	.text-center a.success:hover {
	    background-color: #218838;
	}

	.text-center a.error {
	    background-color: #dc3545;
	}

	.text-center a.error:hover {
	    background-color: #c82333;
	}

</style>

</head>
<body>

<nav class="navbar">
    <a class="navbar-brand">Attendance Management System</a>
</nav>

<div class="container ">
    <div class="row">
        <div class="offset">

            <div class="card">
                <div class="card-header ">
                    <h4>Add Student</h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/add_student/save}" 
                          th:object="${attendance}" 
                          method="post">

                        <div class="form-group">
                            <label>Student Name</label>
                            <input type="text"
                                   th:field="*{student}"
                                   class="form-control"
                                   placeholder="Enter student name"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>
                        </div>
						<div class="form-group">
						    <label>Address</label>
						    <textarea th:field="*{address}"
						              class="form-control"
						              placeholder="Enter student address"
						              rows="3"
						              required></textarea>
						</div>


						<div class="text-center">
						    <a th:href="@{/attendance}" class="success">
						        Save
						    </a>

						    <a th:href="@{/attendance}" class="error">
						        Cancel
						    </a>
						</div>


                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
