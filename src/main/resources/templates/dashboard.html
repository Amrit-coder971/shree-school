<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c3e50;
            padding: 15px 30px;
            color: #ffffff;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
        }

        .right-buttons a {
            text-decoration: none;
            margin-left: 15px;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            color: #ffffff;
        }

        .profile-btn {
            background-color: #3498db;
        }

        .profile-btn:hover {
            background-color: #2980b9;
        }

        .logout-btn {
            background-color: #e74c3c;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        
        .attendance-btn {
            display: inline-block;
            margin: 50px auto;
            padding: 15px 30px;
            background-color: #27ae60;
            color: #fff;
            font-size: 16px;
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
        }

        .attendance-btn:hover {
            background-color: #1e8449;
        }

        .content {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="title">User Dashboard</div>

        <div class="right-buttons">
            <a href="/profile" class="profile-btn">Profile</a>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="content">
        <a href="/view_attendance" class="attendance-btn">View Attendance</a>
    </div>

</body>
</html>
