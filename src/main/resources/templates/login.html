<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
	<style>
		body { display: flex; justify-content: center; align-items: center; flex-direction: column; font-family: Arial, sans-serif; margin: 0; padding: 20px; }

		h2 { text-align: center; margin: 10px 0; }

		form { width: 320px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; margin: 0 auto; }

		div { margin-bottom: 12px; }

		label { display: block; margin-bottom: 5px; font-weight: bold; }

		input[type="email"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

		input[type="submit"] { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }

		input[type="submit"]:hover { background-color: #45a049; }

		a { color: blue; text-decoration: none; }

		a:hover { text-decoration: underline; }

	</style>
</head>
<body>
    <h2>Login</h2>
	
	<p th:if="${error.hasError}" th:text="${error.msg}" style="color: red;"></p>
	
    <form action="/login" method="post" th:object="${form}">

        <div>
            <label for="email">Email:</label>
            <input type="email" th:field="*{email}">
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" th:field="*{password}">
        </div>

        <div>
            <input type="submit" value="Login"> 
        </div>
    </form>
	
	Need an account? <a href="/register">Register here!</a>
</body>
</html>
